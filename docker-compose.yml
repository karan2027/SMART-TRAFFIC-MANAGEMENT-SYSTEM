version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: traffic_mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  backend:
    build: ./backend
    container_name: traffic_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGODB_URI=mongodb://mongodb:27017/traffic_management_db
      - AI_SERVICE_URL=http://ai-engine:8000
    depends_on:
      - mongodb
    volumes:
      - ./data:/app/data

  ai-engine:
    build: ./ai-engine
    container_name: traffic_ai_engine
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data

  frontend:
    build: ./frontend
    container_name: traffic_frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mongo_data:
